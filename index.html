<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pseudomation</title>
  <!-- Pure Black SVG Clock Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000000' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><polyline points='12 6 12 12 16 14'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    :root {
      --bg: #0c0d0e;
      --card-bg: #141618;
      --border: #22252a;
      --text: #e1e4ea;
      --text-muted: #626875;
      --accent: #d1d5db;
      --danger: #ef4444;
      --scrollbar-thumb: #2b2f36;
      --scrollbar-hover: #3d424c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 32px 24px;
      position: relative;
      overflow: hidden;
    }

    /* Top Left: Today's Total */
    .today-reading {
      position: absolute;
      top: 32px;
      left: 32px;
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      z-index: 10;
    }

    .today-reading span {
      color: var(--accent);
      font-weight: 500;
      font-family: 'Share Tech Mono', monospace;
    }

    /* Top Right: Actions Group */
    .top-right-actions {
      position: absolute;
      top: 28px;
      right: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .nav-icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: color 0.2s ease, background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-icon-btn:hover {
      color: var(--accent);
      background: rgba(255, 255, 255, 0.03);
    }

    /* Bottom Right: Live Clock */
    .live-clock {
      position: absolute;
      bottom: 28px;
      right: 32px;
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      z-index: 10;
    }

    /* Left Middle: Reset Button */
    .edge-reset-btn {
      position: fixed;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 20;
    }

    .edge-reset-btn svg {
      width: 16px;
      height: 16px;
    }

    .edge-reset-btn:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.04);
      transform: translateY(-50%) scale(1.08);
    }

    /* Top Center: Title & Description */
    .top-section {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      z-index: 10;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      width: 100%;
      gap: 6px;
    }

    .session-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.15rem;
      color: var(--text-muted);
      user-select: none;
    }

    .session-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .session-title {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      flex: 1;
      max-width: 320px;
      text-align: left;
    }

    .session-desc {
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .session-input::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .session-input:focus {
      border-bottom-color: var(--border);
    }

    /* Middle: Centered Timer Area */
    .timer-center {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      gap: 16px;
    }

    .timer-display {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(3.8rem, 10vw, 6.5rem);
      letter-spacing: 0.12em;
      color: var(--text);
    }

    /* Outer Right Edge Middle Mini Video Player */
    .mini-pip-container {
      display: none;
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      width: 220px;
      height: 124px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      z-index: 40;
    }

    .mini-pip-container.active {
      display: block;
    }

    .mini-pip-frame {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .mini-pip-frame iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      display: block;
      pointer-events: none; /* Disables native YouTube UI clicks and banners */
    }

    /* Overlay on hover with Play/Pause button and subtle close */
    .mini-pip-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    .mini-pip-container:hover .mini-pip-overlay {
      opacity: 1;
    }

    .pip-center-toggle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(20, 22, 24, 0.85);
      border: 1px solid var(--border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .pip-center-toggle:hover {
      transform: scale(1.08);
      background: rgba(30, 34, 38, 0.95);
      border-color: var(--accent);
    }

    .mini-pip-close {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
      z-index: 20;
    }

    .mini-pip-close:hover {
      background: var(--danger);
      border-color: var(--danger);
    }

    /* Bottom: Controls */
    .bottom-controls-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
      z-index: 10;
    }

    .bottom-controls {
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: center;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
    }

    .icon-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.04);
      transform: scale(1.05);
    }

    .icon-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: var(--border);
    }

    /* Fullscreen Modals */
    .modal-fullscreen {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
    }

    .modal-fullscreen.open {
      display: flex;
    }

    .modal-shell {
      width: 100%;
      max-width: 820px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.6rem;
      line-height: 1;
      padding: 4px;
      transition: color 0.15s ease;
    }

    .close-btn:hover {
      color: var(--text);
    }

    /* Custom Scrollbar Container */
    .modal-content {
      padding: 24px 16px 40px 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) transparent;
    }

    .modal-content::-webkit-scrollbar {
      width: 5px;
    }

    .modal-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .modal-content::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }

    .modal-content::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-hover);
    }

    .date-group h4 {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 6px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      position: relative;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-item-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 75%;
      flex: 1;
    }

    .history-item-title {
      font-size: 0.92rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-item-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .history-item-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .history-item-time {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      color: var(--accent);
    }

    /* 3-Dots Dropdown Menu */
    .menu-wrap {
      position: relative;
    }

    .menu-trigger {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 1.2rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-trigger:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 4px;
      background: #181a1d;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 150;
      min-width: 100px;
      overflow: hidden;
    }

    .dropdown-menu.active {
      display: block;
    }

    .dropdown-menu button {
      width: 100%;
      background: none;
      border: none;
      padding: 9px 14px;
      text-align: left;
      font-size: 0.82rem;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s ease;
      display: block;
    }

    .dropdown-menu button:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .dropdown-menu button.danger {
      color: var(--danger);
    }

    .dropdown-menu button.danger:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    /* Music Modal Comprehensive Player Bar */
    .music-player-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .music-panel-track-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      max-width: 70%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .panel-status {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: var(--accent);
    }

    .music-panel-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .panel-buttons-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .panel-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .panel-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .panel-btn.active {
      color: #0c0d0e;
      background: var(--text);
      border-color: var(--text);
    }

    .panel-play-btn {
      width: 42px;
      height: 42px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .panel-seek-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 200px;
    }

    .seek-slider {
      flex: 1;
      height: 4px;
      background: #23272d;
      border-radius: 2px;
      appearance: none;
      outline: none;
      cursor: pointer;
    }

    .seek-slider::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .time-tag {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    /* Music Modal Add Form */
    .music-add-form {
      display: flex;
      gap: 12px;
      background: var(--card-bg);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .music-url-input {
      flex: 1;
      background: #0d0f11;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .music-url-input:focus {
      border-color: var(--accent);
    }

    .music-add-btn {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    .music-add-btn:hover {
      opacity: 0.88;
    }

    .music-list-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
  </style>
</head>
<body>

  <!-- Top-left: Today total -->
  <div class="today-reading">
    TODAY: <span id="todayTotal">00:00:00</span>
  </div>

  <!-- Top-right: Music & History Icons -->
  <div class="top-right-actions">
    <button class="nav-icon-btn" id="openMusic" aria-label="Open Music" title="Background Music">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>

    <button class="nav-icon-btn" id="openHistory" aria-label="Open History" title="View History">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="10" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </button>
  </div>

  <!-- Left Middle: Reset Button -->
  <button class="edge-reset-btn" id="resetBtn" aria-label="Reset Timer (R)" title="Reset Timer [R]">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
      <path d="M3 3v5h5"></path>
    </svg>
  </button>

  <!-- Top Center: Name & Description -->
  <header class="top-section">
    <div class="title-row">
      <span class="session-badge" id="sessionBadge">S1:</span>
      <input type="text" id="sessionName" class="session-input session-title" placeholder="Session Title" autocomplete="off" />
    </div>
    <input type="text" id="sessionDesc" class="session-input session-desc" placeholder="Add a short description..." autocomplete="off" />
  </header>

  <!-- Middle: Centered Timer -->
  <main class="timer-center">
    <div class="timer-display" id="display">00:00:00</div>
  </main>

  <!-- Outer Right Edge Mini Preview Player (No Buttons Except Play/Pause on Hover) -->
  <aside class="mini-pip-container" id="miniPipContainer">
    <button class="mini-pip-close" id="closePipBtn" title="Close Preview Player">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="mini-pip-overlay" id="pipOverlay">
      <div class="pip-center-toggle" id="pipPlayPauseBtn" title="Play / Pause">
        <svg id="pipPlayIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <svg id="pipPauseIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </div>
    </div>
    <div class="mini-pip-frame">
      <div id="ytPlayerContainer"></div>
    </div>
  </aside>

  <!-- Bottom: Timer Controls -->
  <div class="bottom-controls-wrap">
    <footer class="bottom-controls">
      <button class="icon-btn" id="playPauseBtn" aria-label="Start / Pause (Space or K)" title="Play / Pause [Space / K]">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>

      <button class="icon-btn" id="stopBtn" disabled aria-label="Complete and Save (Enter)" title="Complete & Save [Enter]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </footer>
  </div>

  <!-- Bottom Right: Live Clock -->
  <div class="live-clock" id="liveClock">--</div>

  <!-- Fullscreen History Screen -->
  <div class="modal-fullscreen" id="historyModal">
    <div class="modal-shell">
      <div class="modal-header">
        <h3>Study History</h3>
        <button class="close-btn" id="closeHistory" aria-label="Close History">&times;</button>
      </div>
      <div class="modal-content" id="historyContainer"></div>
    </div>
  </div>

  <!-- Fullscreen Music Screen -->
  <div class="modal-fullscreen" id="musicModal">
    <div class="modal-shell">
      <div class="modal-header">
        <h3>Music & Audio</h3>
        <button class="close-btn" id="closeMusic" aria-label="Close Music">&times;</button>
      </div>
      <div class="modal-content">
        
        <!-- Comprehensive Player Controls Section -->
        <div class="music-player-panel">
          <div class="music-panel-track-info">
            <span class="panel-title" id="panelTrackTitle">No track selected</span>
            <span class="panel-status" id="panelStatus">IDLE</span>
          </div>

          <div class="music-panel-controls">
            <div class="panel-buttons-group">
              <button class="panel-btn" id="panelPrevBtn" title="Restart / Backward 10s">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="3"></line></svg>
              </button>

              <button class="panel-btn panel-play-btn" id="panelPlayPauseBtn" title="Play / Pause">
                <svg id="panelPlayIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <svg id="panelPauseIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
              </button>

              <button class="panel-btn" id="panelNextBtn" title="Forward 10s">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="3"></line></svg>
              </button>

              <button class="panel-btn" id="panelLoopBtn" title="Toggle Loop">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="17 1 21 5 17 9"></polyline>
                  <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                  <polyline points="7 23 3 19 7 15"></polyline>
                  <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                </svg>
              </button>

              <button class="panel-btn" id="panelMuteBtn" title="Mute / Unmute">
                <svg id="panelVolIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <svg id="panelMuteIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <line x1="23" y1="9" x2="17" y2="15"></line>
                  <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
              </button>
            </div>

            <div class="panel-seek-wrap">
              <span class="time-tag" id="panelCurrTime">00:00</span>
              <input type="range" class="seek-slider" id="panelSeekBar" min="0" max="100" value="0" />
              <span class="time-tag" id="panelTotalTime">00:00</span>
            </div>
          </div>
        </div>

        <!-- Add Video Form (Auto Title Resolution) -->
        <form class="music-add-form" id="musicAddForm">
          <input type="text" id="musicUrlInput" class="music-url-input" placeholder="Paste YouTube link or Video ID (Title is automatically retrieved)..." autocomplete="off" required />
          <button type="submit" class="music-add-btn" id="musicSubmitBtn">Add Track</button>
        </form>

        <!-- Saved Tracks List with Date Separations -->
        <div class="music-list-section" id="musicContainer"></div>
      </div>
    </div>
  </div>

  <!-- Firebase Modular SDK Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvyIQNVjXPnVnYQWIcPrr5lrEAKbGr54k",
      authDomain: "ewtube-b3413.firebaseapp.com",
      databaseURL: "https://ewtube-b3413-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ewtube-b3413",
      storageBucket: "ewtube-b3413.firebasestorage.app",
      messagingSenderId: "67454816410",
      appId: "1:67454816410:web:27d326bf9668e5c64fcf23"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const sessionsRef = ref(db, 'study_sessions');
    const musicRef = ref(db, 'music');

    let cachedSessions = [];
    let cachedTracks = [];
    let secondsElapsed = 0;
    let timerInterval = null;

    // Player State
    let ytPlayer = null;
    let isPlaying = false;
    let isLooping = false;
    let currentVideoId = null;
    let currentTrackTitle = '';
    let progressTimer = null;

    // Elements
    const display = document.getElementById('display');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');
    const sessionBadge = document.getElementById('sessionBadge');
    const nameInput = document.getElementById('sessionName');
    const descInput = document.getElementById('sessionDesc');
    const todayTotalDisplay = document.getElementById('todayTotal');
    const liveClock = document.getElementById('liveClock');

    // Mini Pip Player Elements
    const miniPipContainer = document.getElementById('miniPipContainer');
    const pipOverlay = document.getElementById('pipOverlay');
    const pipPlayPauseBtn = document.getElementById('pipPlayPauseBtn');
    const pipPlayIcon = document.getElementById('pipPlayIcon');
    const pipPauseIcon = document.getElementById('pipPauseIcon');
    const closePipBtn = document.getElementById('closePipBtn');

    // Music Panel Elements
    const panelTrackTitle = document.getElementById('panelTrackTitle');
    const panelStatus = document.getElementById('panelStatus');
    const panelPlayPauseBtn = document.getElementById('panelPlayPauseBtn');
    const panelPlayIcon = document.getElementById('panelPlayIcon');
    const panelPauseIcon = document.getElementById('panelPauseIcon');
    const panelPrevBtn = document.getElementById('panelPrevBtn');
    const panelNextBtn = document.getElementById('panelNextBtn');
    const panelLoopBtn = document.getElementById('panelLoopBtn');
    const panelMuteBtn = document.getElementById('panelMuteBtn');
    const panelVolIcon = document.getElementById('panelVolIcon');
    const panelMuteIcon = document.getElementById('panelMuteIcon');
    const panelSeekBar = document.getElementById('panelSeekBar');
    const panelCurrTime = document.getElementById('panelCurrTime');
    const panelTotalTime = document.getElementById('panelTotalTime');

    // Modals
    const historyModal = document.getElementById('historyModal');
    const openHistory = document.getElementById('openHistory');
    const closeHistory = document.getElementById('closeHistory');
    const historyContainer = document.getElementById('historyContainer');

    const musicModal = document.getElementById('musicModal');
    const openMusic = document.getElementById('openMusic');
    const closeMusic = document.getElementById('closeMusic');
    const musicAddForm = document.getElementById('musicAddForm');
    const musicUrlInput = document.getElementById('musicUrlInput');
    const musicSubmitBtn = document.getElementById('musicSubmitBtn');
    const musicContainer = document.getElementById('musicContainer');

    function closeAllDropdowns() {
      document.querySelectorAll('.dropdown-menu.active').forEach(menu => {
        menu.classList.remove('active');
      });
    }

    openHistory.addEventListener('click', () => {
      renderHistory();
      historyModal.classList.add('open');
    });

    closeHistory.addEventListener('click', () => {
      historyModal.classList.remove('open');
      closeAllDropdowns();
    });

    openMusic.addEventListener('click', () => {
      renderMusic();
      musicModal.classList.add('open');
    });

    closeMusic.addEventListener('click', () => {
      musicModal.classList.remove('open');
    });

    function extractYouTubeID(url) {
      if (!url) return null;
      const clean = url.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(clean)) return clean;
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = clean.match(regExp);
      return match ? match[1] : null;
    }

    // Auto-fetch YouTube title via official no-auth oEmbed endpoint
    async function fetchYouTubeTitle(videoId) {
      try {
        const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
        const data = await response.json();
        return data.title || null;
      } catch (err) {
        return null;
      }
    }

    // Initialize or Play video using YouTube API
    function playTrack(videoId, title) {
      currentVideoId = videoId;
      currentTrackTitle = title || 'Audio Track';
      panelTrackTitle.textContent = currentTrackTitle;
      panelStatus.textContent = 'PLAYING';

      miniPipContainer.classList.add('active');
      musicModal.classList.remove('open');

      if (!ytPlayer) {
        document.getElementById('ytPlayerContainer').innerHTML = '<div id="yt-player-frame"></div>';
        ytPlayer = new YT.Player('yt-player-frame', {
          videoId: videoId,
          playerVars: {
            autoplay: 1,
            controls: 0,
            disablekb: 1,
            fs: 0,
            modestbranding: 1,
            rel: 0,
            playsinline: 1,
            origin: window.location.origin
          },
          events: {
            onReady: (e) => {
              e.target.unMute();
              e.target.playVideo();
              updatePlayerUIState(true);
              startProgressSync();
            },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.PLAYING) {
                updatePlayerUIState(true);
              } else if (e.data === YT.PlayerState.PAUSED) {
                updatePlayerUIState(false);
              } else if (e.data === YT.PlayerState.ENDED) {
                if (isLooping) {
                  ytPlayer.seekTo(0);
                  ytPlayer.playVideo();
                } else {
                  updatePlayerUIState(false);
                }
              }
            }
          }
        });
      } else {
        ytPlayer.loadVideoById(videoId);
        ytPlayer.unMute();
        ytPlayer.playVideo();
        updatePlayerUIState(true);
        startProgressSync();
      }
    }

    function togglePlayback() {
      if (!ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
      const state = ytPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
        updatePlayerUIState(false);
      } else {
        ytPlayer.playVideo();
        updatePlayerUIState(true);
      }
    }

    function updatePlayerUIState(playing) {
      isPlaying = playing;
      panelStatus.textContent = playing ? 'PLAYING' : 'PAUSED';

      pipPlayIcon.style.display = playing ? 'none' : 'block';
      pipPauseIcon.style.display = playing ? 'block' : 'none';

      panelPlayIcon.style.display = playing ? 'none' : 'block';
      panelPauseIcon.style.display = playing ? 'block' : 'none';
    }

    function startProgressSync() {
      clearInterval(progressTimer);
      progressTimer = setInterval(() => {
        if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function' && typeof ytPlayer.getDuration === 'function') {
          const curr = ytPlayer.getCurrentTime() || 0;
          const dur = ytPlayer.getDuration() || 0;
          panelCurrTime.textContent = formatSec(curr);
          panelTotalTime.textContent = formatSec(dur);

          if (dur > 0) {
            panelSeekBar.value = (curr / dur) * 100;
          }
        }
      }, 500);
    }

    function formatSec(seconds) {
      const s = Math.floor(seconds);
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    // Mini Pip Controls
    pipPlayPauseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlayback();
    });

    pipOverlay.addEventListener('click', () => {
      togglePlayback();
    });

    closePipBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      miniPipContainer.classList.remove('active');
      if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
        ytPlayer.stopVideo();
      }
      clearInterval(progressTimer);
      updatePlayerUIState(false);
      panelStatus.textContent = 'IDLE';
    });

    // Modal Player Panel Controls
    panelPlayPauseBtn.addEventListener('click', togglePlayback);

    panelLoopBtn.addEventListener('click', () => {
      isLooping = !isLooping;
      panelLoopBtn.classList.toggle('active', isLooping);
    });

    panelMuteBtn.addEventListener('click', () => {
      if (!ytPlayer || typeof ytPlayer.isMuted !== 'function') return;
      if (ytPlayer.isMuted()) {
        ytPlayer.unMute();
        panelVolIcon.style.display = 'block';
        panelMuteIcon.style.display = 'none';
      } else {
        ytPlayer.mute();
        panelVolIcon.style.display = 'none';
        panelMuteIcon.style.display = 'block';
      }
    });

    panelPrevBtn.addEventListener('click', () => {
      if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
        const curr = ytPlayer.getCurrentTime() || 0;
        ytPlayer.seekTo(Math.max(curr - 10, 0), true);
      }
    });

    panelNextBtn.addEventListener('click', () => {
      if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
        const curr = ytPlayer.getCurrentTime() || 0;
        const dur = ytPlayer.getDuration() || 0;
        ytPlayer.seekTo(Math.min(curr + 10, dur), true);
      }
    });

    panelSeekBar.addEventListener('input', () => {
      if (ytPlayer && typeof ytPlayer.getDuration === 'function') {
        const dur = ytPlayer.getDuration() || 0;
        const target = (panelSeekBar.value / 100) * dur;
        ytPlayer.seekTo(target, true);
      }
    });

    // Add Music Form Submission
    musicAddForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawUrl = musicUrlInput.value.trim();
      const videoId = extractYouTubeID(rawUrl);

      if (!videoId) {
        alert('Please enter a valid YouTube video link or 11-character video ID.');
        return;
      }

      musicSubmitBtn.disabled = true;
      musicSubmitBtn.textContent = 'Fetching...';

      // Auto resolve video title
      const fetchedTitle = await fetchYouTubeTitle(videoId);
      const title = fetchedTitle || 'Lofi Session Track';

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');

      const trackData = {
        title: title,
        url: rawUrl,
        videoId: videoId,
        date: `${yyyy}-${mm}-${dd}`,
        createdAt: Date.now()
      };

      try {
        const newTrackRef = push(musicRef);
        await set(newTrackRef, trackData);
        musicUrlInput.value = '';
      } catch (err) {
        console.error('Firebase save error:', err);
        alert('Database save failed: ' + err.message);
      } finally {
        musicSubmitBtn.disabled = false;
        musicSubmitBtn.textContent = 'Add Track';
      }
    });

    // Music Firebase Listener
    onValue(musicRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        // Chronological order for consistent sequential numbering (S1, S2, S3...)
        cachedTracks = Object.keys(data).map(key => ({
          firebaseKey: key,
          ...data[key]
        })).sort((a, b) => a.createdAt - b.createdAt);
      } else {
        cachedTracks = [];
      }
      if (musicModal.classList.contains('open')) {
        renderMusic();
      }
    }, (err) => {
      console.warn('Music listener warning:', err.message);
    });

    // Render Music with Date Separations & S1, S2 Numbering
    function renderMusic() {
      if (!cachedTracks.length) {
        musicContainer.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 36px 0;">No tracks saved yet. Add a link above!</p>';
        return;
      }

      // Group tracks by date
      const grouped = cachedTracks.reduce((acc, curr, index) => {
        const itemWithIndex = { ...curr, itemNum: index + 1 };
        acc[curr.date] = acc[curr.date] || [];
        acc[curr.date].push(itemWithIndex);
        return acc;
      }, {});

      // Sort dates descending (latest date first)
      const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

      musicContainer.innerHTML = '';
      sortedDates.forEach(date => {
        const groupEl = document.createElement('div');
        groupEl.className = 'date-group';

        const dateLabel = new Date(date + 'T00:00:00').toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        groupEl.innerHTML = `<h4>${dateLabel}</h4>`;

        grouped[date].forEach(track => {
          const row = document.createElement('div');
          row.className = 'history-item';
          row.innerHTML = `
            <div class="history-item-meta">
              <span class="history-item-title">
                <span style="font-family: 'Share Tech Mono', monospace; color: var(--text-muted);">S${track.itemNum}:</span>
                ${track.title}
              </span>
            </div>
            <div class="history-item-right">
              <button class="nav-icon-btn play-track-btn" data-video="${track.videoId}" data-title="S${track.itemNum}: ${encodeURIComponent(track.title)}" title="Play Track">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              </button>
              <button class="nav-icon-btn delete-track-btn" data-key="${track.firebaseKey}" title="Delete track">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            </div>
          `;
          groupEl.appendChild(row);
        });

        musicContainer.appendChild(groupEl);
      });

      musicContainer.querySelectorAll('.play-track-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const vid = btn.dataset.video;
          const title = decodeURIComponent(btn.dataset.title);
          playTrack(vid, title);
        });
      });

      musicContainer.querySelectorAll('.delete-track-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const key = btn.dataset.key;
          if (confirm('Delete this track from history?')) {
            try {
              await remove(ref(db, `music/${key}`));
            } catch (err) {
              console.error(err);
              alert('Permission denied deleting track.');
            }
          }
        });
      });
    }

    // Timer & Session Logic
    function formatTime(totalSeconds) {
      const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const s = String(totalSeconds % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function getNextSessionNumber() {
      if (!cachedSessions.length) return 1;
      const numbers = cachedSessions.map(item => item.sessionNum || 0);
      return Math.max(...numbers, 0) + 1;
    }

    function updateSessionBadge() {
      const nextNum = getNextSessionNumber();
      sessionBadge.textContent = `S${nextNum}:`;
    }

    function updateTodayTotal() {
      const todayStr = new Date().toISOString().split('T')[0];
      const todaySeconds = cachedSessions
        .filter(entry => entry.date === todayStr)
        .reduce((sum, entry) => sum + entry.duration, 0);
      todayTotalDisplay.textContent = formatTime(todaySeconds);
    }

    function updateLiveClock() {
      const now = new Date();
      const dateStr = now.toLocaleDateString(undefined, {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });
      const timeStr = now.toLocaleTimeString(undefined, {
        hour: '2-digit',
        minute: '2-digit'
      });
      liveClock.textContent = `${dateStr} · ${timeStr}`;
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    function setRunningState(isRunning) {
      if (isRunning) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        playPauseBtn.title = 'Pause [Space / K]';
        stopBtn.disabled = false;
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        playPauseBtn.title = secondsElapsed > 0 ? 'Resume [Space / K]' : 'Start [Space / K]';
      }
    }

    // Sessions Firebase Listener
    onValue(sessionsRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        cachedSessions = Object.keys(data).map(key => ({
          firebaseKey: key,
          ...data[key]
        })).sort((a, b) => b.createdAt - a.createdAt);
      } else {
        cachedSessions = [];
      }
      updateTodayTotal();
      updateSessionBadge();
      if (historyModal.classList.contains('open')) {
        renderHistory();
      }
    }, (err) => {
      console.warn('Sessions listener warning:', err.message);
    });

    function renderHistory() {
      if (!cachedSessions.length) {
        historyContainer.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 48px 0;">No sessions recorded yet.</p>';
        return;
      }

      const grouped = cachedSessions.reduce((acc, curr) => {
        acc[curr.date] = acc[curr.date] || [];
        acc[curr.date].push(curr);
        return acc;
      }, {});

      historyContainer.innerHTML = '';
      Object.keys(grouped).forEach(date => {
        const groupEl = document.createElement('div');
        groupEl.className = 'date-group';

        const dateLabel = new Date(date + 'T00:00:00').toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        groupEl.innerHTML = `<h4>${dateLabel}</h4>`;

        grouped[date].forEach(item => {
          const row = document.createElement('div');
          row.className = 'history-item';
          row.innerHTML = `
            <div class="history-item-meta">
              <span class="history-item-title">${item.name}</span>
              ${item.desc ? `<span class="history-item-desc">${item.desc}</span>` : ''}
            </div>
            <div class="history-item-right">
              <div class="history-item-time">${formatTime(item.duration)}</div>
              <div class="menu-wrap">
                <button class="menu-trigger" data-key="${item.firebaseKey}" aria-label="Options">&#8942;</button>
                <div class="dropdown-menu" id="session-menu-${item.firebaseKey}">
                  <button class="danger delete-session-action" data-key="${item.firebaseKey}">Delete</button>
                </div>
              </div>
            </div>
          `;
          groupEl.appendChild(row);
        });

        historyContainer.appendChild(groupEl);
      });

      historyContainer.querySelectorAll('.menu-trigger').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const menu = document.getElementById(`session-menu-${btn.dataset.key}`);
          const wasOpen = menu.classList.contains('active');
          closeAllDropdowns();
          if (!wasOpen) menu.classList.add('active');
        });
      });

      historyContainer.querySelectorAll('.delete-session-action').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          closeAllDropdowns();
          const key = btn.dataset.key;
          if (confirm('Delete this study session record?')) {
            try {
              await remove(ref(db, `study_sessions/${key}`));
            } catch (err) {
              console.error(err);
              alert('Permission denied deleting session.');
            }
          }
        });
      });
    }

    function toggleTimer() {
      if (!timerInterval) {
        timerInterval = setInterval(() => {
          secondsElapsed++;
          display.textContent = formatTime(secondsElapsed);
        }, 1000);
        setRunningState(true);
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
        setRunningState(false);
      }
    }

    async function finishSession() {
      if (secondsElapsed > 0) {
        clearInterval(timerInterval);
        timerInterval = null;

        const sessionNum = getNextSessionNumber();
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const defaultName = `S${sessionNum}: ${yyyy}-${mm}-${dd} ${hh}:${min}`;

        const inputVal = nameInput.value.trim();
        const sessionTitle = inputVal ? `S${sessionNum}: ${inputVal}` : defaultName;

        const sessionData = {
          sessionNum: sessionNum,
          name: sessionTitle,
          desc: descInput.value.trim(),
          duration: secondsElapsed,
          date: `${yyyy}-${mm}-${dd}`,
          createdAt: Date.now()
        };

        try {
          const newSessionRef = push(sessionsRef);
          await set(newSessionRef, sessionData);
        } catch (err) {
          console.error('Session save error:', err);
          alert('Database Permission Denied saving session.');
        }

        secondsElapsed = 0;
        display.textContent = '00:00:00';
        setRunningState(false);
        stopBtn.disabled = true;
        nameInput.value = '';
        descInput.value = '';
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      secondsElapsed = 0;
      display.textContent = '00:00:00';
      setRunningState(false);
      stopBtn.disabled = true;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    playPauseBtn.addEventListener('click', toggleTimer);
    stopBtn.addEventListener('click', finishSession);
    resetBtn.addEventListener('click', resetTimer);

    // Global Key Handlers
    window.addEventListener('keydown', (e) => {
      const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (activeTag === 'input' || activeTag === 'textarea') {
        if (e.key === 'Enter' && document.activeElement.id === 'sessionName') {
          e.preventDefault();
          document.activeElement.blur();
          finishSession();
        }
        return;
      }

      if (e.code === 'Space' || e.key === 'k' || e.key === 'K') {
        e.preventDefault();
        toggleTimer();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        finishSession();
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        resetTimer();
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key === 'Escape') {
        historyModal.classList.remove('open');
        musicModal.classList.remove('open');
        closeAllDropdowns();
      }
    });

    window.addEventListener('click', (e) => {
      if (!e.target.closest('.menu-wrap')) {
        closeAllDropdowns();
      }
    });
  </script>
</body>
</html>
