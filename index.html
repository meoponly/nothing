<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pseudomation</title>
  <!-- Pure Black SVG Clock Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000000' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><polyline points='12 6 12 12 16 14'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0d0e;
      --card-bg: #141618;
      --border: #22252a;
      --text: #e1e4ea;
      --text-muted: #626875;
      --accent: #d1d5db;
      --danger: #ef4444;
      --scrollbar-thumb: #2b2f36;
      --scrollbar-hover: #3d424c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 32px 24px;
      position: relative;
      overflow: hidden;
    }

    /* Top Left: Today's Total */
    .today-reading {
      position: absolute;
      top: 32px;
      left: 32px;
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      z-index: 10;
    }

    .today-reading span {
      color: var(--accent);
      font-weight: 500;
      font-family: 'Share Tech Mono', monospace;
    }

    /* Top Right: Actions Group */
    .top-right-actions {
      position: absolute;
      top: 28px;
      right: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .nav-icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: color 0.2s ease, background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-icon-btn:hover {
      color: var(--accent);
      background: rgba(255, 255, 255, 0.03);
    }

    /* Bottom Right: Live Clock */
    .live-clock {
      position: absolute;
      bottom: 28px;
      right: 32px;
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      z-index: 10;
    }

    /* Left Middle: Reset Button */
    .edge-reset-btn {
      position: fixed;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 20;
    }

    .edge-reset-btn svg {
      width: 16px;
      height: 16px;
    }

    .edge-reset-btn:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.04);
      transform: translateY(-50%) scale(1.08);
    }

    /* Top Center: Title & Description */
    .top-section {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      z-index: 10;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      width: 100%;
      gap: 6px;
    }

    .session-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.15rem;
      color: var(--text-muted);
      user-select: none;
    }

    .session-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .session-title {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      flex: 1;
      max-width: 320px;
      text-align: left;
    }

    .session-desc {
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .session-input::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .session-input:focus {
      border-bottom-color: var(--border);
    }

    /* Middle: Centered Timer */
    .timer-center {
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .timer-display {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(3.8rem, 10vw, 6.5rem);
      letter-spacing: 0.12em;
      color: var(--text);
    }

    /* Bottom: Controls & Persistent Mini Music Control */
    .bottom-controls-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
      z-index: 10;
    }

    .bottom-controls {
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: center;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
    }

    .icon-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.04);
      transform: scale(1.05);
    }

    .icon-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: var(--border);
    }

    /* Compact Bottom Now-Playing Bar */
    .music-bar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 6px 14px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      max-width: 320px;
    }

    .music-bar.active {
      display: flex;
    }

    .music-bar-playpause {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0;
    }

    .music-bar-playpause svg {
      width: 14px;
      height: 14px;
    }

    .music-bar-title {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    /* Fullscreen Modals */
    .modal-fullscreen {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
    }

    .modal-fullscreen.open {
      display: flex;
    }

    .modal-shell {
      width: 100%;
      max-width: 820px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.6rem;
      line-height: 1;
      padding: 4px;
      transition: color 0.15s ease;
    }

    .close-btn:hover {
      color: var(--text);
    }

    /* Music Input Bar in Modal */
    .music-input-section {
      padding-top: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .music-input-section input {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .music-input-section input:focus {
      border-color: var(--accent);
    }

    .music-input-section button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .music-input-section button:hover {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.04);
    }

    /* Custom Scrollbar Container */
    .modal-content {
      padding: 24px 16px 40px 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) transparent;
    }

    .modal-content::-webkit-scrollbar {
      width: 5px;
    }

    .modal-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .modal-content::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }

    .modal-content::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-hover);
    }

    .date-group h4 {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 6px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      position: relative;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-item-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 75%;
      flex: 1;
      cursor: pointer;
    }

    .history-item-title {
      font-size: 0.92rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-item-title.active-playing {
      color: #38bdf8;
    }

    .history-item-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .history-item-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .history-item-time {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      color: var(--accent);
    }

    /* 3-Dots Dropdown Menu */
    .menu-wrap {
      position: relative;
    }

    .menu-trigger {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 1.2rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-trigger:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 4px;
      background: #181a1d;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 150;
      min-width: 100px;
      overflow: hidden;
    }

    .dropdown-menu.active {
      display: block;
    }

    .dropdown-menu button {
      width: 100%;
      background: none;
      border: none;
      padding: 9px 14px;
      text-align: left;
      font-size: 0.82rem;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s ease;
      display: block;
    }

    .dropdown-menu button:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .dropdown-menu button.danger {
      color: var(--danger);
    }

    .dropdown-menu button.danger:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    /* Off-screen minimal YouTube IFrame player */
    #yt-hidden-player-wrap {
      position: absolute;
      width: 1px;
      height: 1px;
      top: -1000px;
      left: -1000px;
      opacity: 0.01;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Top-left: Today total -->
  <div class="today-reading">
    TODAY: <span id="todayTotal">00:00:00</span>
  </div>

  <!-- Top-right: Music & History Icons -->
  <div class="top-right-actions">
    <button class="nav-icon-btn" id="openMusic" aria-label="Open Music" title="Background Music">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>

    <button class="nav-icon-btn" id="openHistory" aria-label="Open History" title="View History">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="10" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </button>
  </div>

  <!-- Left Middle: Reset Button -->
  <button class="edge-reset-btn" id="resetBtn" aria-label="Reset Timer (R)" title="Reset Timer [R]">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
      <path d="M3 3v5h5"></path>
    </svg>
  </button>

  <!-- Top Center: Name & Description -->
  <header class="top-section">
    <div class="title-row">
      <span class="session-badge" id="sessionBadge">S1:</span>
      <input type="text" id="sessionName" class="session-input session-title" placeholder="Session Title" autocomplete="off" />
    </div>
    <input type="text" id="sessionDesc" class="session-input session-desc" placeholder="Add a short description..." autocomplete="off" />
  </header>

  <!-- Middle: Centered Timer -->
  <main class="timer-center">
    <div class="timer-display" id="display">00:00:00</div>
  </main>

  <!-- Bottom: Timer Controls & Mini Music Bar -->
  <div class="bottom-controls-wrap">
    <!-- Quick Music Mini-Player -->
    <div class="music-bar" id="musicBar">
      <button class="music-bar-playpause" id="musicBarToggle" aria-label="Play/Pause Music">
        <svg id="musicBarPlayIcon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <svg id="musicBarPauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>
      <span class="music-bar-title" id="musicBarTitle">No track playing</span>
    </div>

    <footer class="bottom-controls">
      <button class="icon-btn" id="playPauseBtn" aria-label="Start / Pause (Space or K)" title="Play / Pause [Space / K]">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>

      <button class="icon-btn" id="stopBtn" disabled aria-label="Complete and Save (Enter)" title="Complete & Save [Enter]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </footer>
  </div>

  <!-- Bottom Right: Live Clock -->
  <div class="live-clock" id="liveClock">--</div>

  <!-- Fullscreen History Screen -->
  <div class="modal-fullscreen" id="historyModal">
    <div class="modal-shell">
      <div class="modal-header">
        <h3>Study History</h3>
        <button class="close-btn" id="closeHistory" aria-label="Close History">&times;</button>
      </div>
      <div class="modal-content" id="historyContainer"></div>
    </div>
  </div>

  <!-- Fullscreen Music Screen -->
  <div class="modal-fullscreen" id="musicModal">
    <div class="modal-shell">
      <div class="modal-header">
        <h3>Background Music</h3>
        <button class="close-btn" id="closeMusic" aria-label="Close Music">&times;</button>
      </div>
      <div class="music-input-section">
        <input type="text" id="ytUrlInput" placeholder="Paste YouTube link (e.g. https://youtu.be/...)" autocomplete="off" />
        <button id="addMusicBtn">Add Track</button>
      </div>
      <div class="modal-content" id="musicContainer"></div>
    </div>
  </div>

  <!-- Hidden Container for YouTube Iframe API -->
  <div id="yt-hidden-player-wrap">
    <div id="ytplayer"></div>
  </div>

  <!-- YouTube Iframe API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- Firebase Modular SDK Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvyIQNVjXPnVnYQWIcPrr5lrEAKbGr54k",
      authDomain: "ewtube-b3413.firebaseapp.com",
      databaseURL: "https://ewtube-b3413-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ewtube-b3413",
      storageBucket: "ewtube-b3413.firebasestorage.app",
      messagingSenderId: "67454816410",
      appId: "1:67454816410:web:27d326bf9668e5c64fcf23"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const sessionsRef = ref(db, 'study_sessions');
    const musicRef = ref(db, 'music_tracks');

    let cachedSessions = [];
    let cachedTracks = [];
    let secondsElapsed = 0;
    let timerInterval = null;

    // Elements
    const display = document.getElementById('display');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');
    const sessionBadge = document.getElementById('sessionBadge');
    const nameInput = document.getElementById('sessionName');
    const descInput = document.getElementById('sessionDesc');
    const todayTotalDisplay = document.getElementById('todayTotal');
    const liveClock = document.getElementById('liveClock');

    // Modals
    const historyModal = document.getElementById('historyModal');
    const openHistory = document.getElementById('openHistory');
    const closeHistory = document.getElementById('closeHistory');
    const historyContainer = document.getElementById('historyContainer');

    const musicModal = document.getElementById('musicModal');
    const openMusic = document.getElementById('openMusic');
    const closeMusic = document.getElementById('closeMusic');
    const musicContainer = document.getElementById('musicContainer');
    const ytUrlInput = document.getElementById('ytUrlInput');
    const addMusicBtn = document.getElementById('addMusicBtn');

    // Mini music bar
    const musicBar = document.getElementById('musicBar');
    const musicBarToggle = document.getElementById('musicBarToggle');
    const musicBarPlayIcon = document.getElementById('musicBarPlayIcon');
    const musicBarPauseIcon = document.getElementById('musicBarPauseIcon');
    const musicBarTitle = document.getElementById('musicBarTitle');

    // YouTube Audio Player Handler
    let ytPlayer = null;
    let activeTrack = null;
    let isMusicPlaying = false;

    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('ytplayer', {
        height: '100',
        width: '100',
        playerVars: {
          playsinline: 1,
          controls: 0,
          disablekb: 1,
          fs: 0
        },
        events: {
          onReady: (e) => {
            e.target.setPlaybackQuality('small');
          },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              isMusicPlaying = true;
              e.target.setPlaybackQuality('small');
              updateMusicUI();
            } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
              isMusicPlaying = false;
              updateMusicUI();
            }
          }
        }
      });
    };

    function extractVideoId(url) {
      if (!url) return null;
      const cleanUrl = url.trim();
      
      // Match 11-char ID directly if user pasted only the ID
      if (/^[a-zA-Z0-9_-]{11}$/.test(cleanUrl)) {
        return cleanUrl;
      }
      
      const regExp = /(?:youtube(?:-nocookie)?\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?|shorts|live)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
      const match = cleanUrl.match(regExp);
      return match ? match[1] : null;
    }

    function playTrack(track) {
      activeTrack = track;
      musicBar.classList.add('active');
      musicBarTitle.textContent = `${track.title}`;

      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById({
          videoId: track.videoId,
          suggestedQuality: 'small'
        });
      }
      renderMusic();
    }

    function toggleMusicPlayback() {
      if (!ytPlayer || !activeTrack) return;
      if (isMusicPlaying) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    function updateMusicUI() {
      if (isMusicPlaying) {
        musicBarPlayIcon.style.display = 'none';
        musicBarPauseIcon.style.display = 'block';
      } else {
        musicBarPlayIcon.style.display = 'block';
        musicBarPauseIcon.style.display = 'none';
      }
      renderMusic();
    }

    musicBarToggle.addEventListener('click', toggleMusicPlayback);

    // Fast title fetch with timeout fallback
    async function fetchVideoTitle(videoId) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 2000);

      try {
        const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`, {
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error('Fetch failed');
        const data = await res.json();
        return data.title || `Track (${videoId})`;
      } catch {
        clearTimeout(timeoutId);
        return `Track (${videoId})`;
      }
    }

    function getNextTrackNumber() {
      if (!cachedTracks.length) return 1;
      const numbers = cachedTracks.map(t => t.trackNum || 0);
      return Math.max(...numbers, 0) + 1;
    }

    // Helper to ensure Firebase write doesn't hang forever
    function withTimeout(promise, ms = 8000) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('Database operation timed out. Check network or Firebase security rules.')), ms))
      ]);
    }

    async function handleAddMusic() {
      const url = ytUrlInput.value.trim();
      if (!url) return;

      const videoId = extractVideoId(url);
      if (!videoId) {
        alert('Invalid YouTube URL or ID. Please check the link and try again.');
        return;
      }

      addMusicBtn.disabled = true;
      addMusicBtn.textContent = 'Adding...';

      try {
        const rawTitle = await fetchVideoTitle(videoId);
        const trackNum = getNextTrackNumber();
        const prefixedTitle = `M${trackNum}: ${rawTitle}`;

        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');

        const newTrack = {
          trackNum: trackNum,
          title: prefixedTitle,
          videoId: videoId,
          date: `${yyyy}-${mm}-${dd}`,
          createdAt: Date.now()
        };

        const newRef = push(musicRef);
        await withTimeout(set(newRef, newTrack));

        ytUrlInput.value = '';
      } catch (err) {
        console.error('Failed to add track:', err);
        alert(`Could not add track: ${err.message || 'Database error. Make sure your Firebase Realtime Database rules allow writes.'}`);
      } finally {
        addMusicBtn.disabled = false;
        addMusicBtn.textContent = 'Add Track';
      }
    }

    addMusicBtn.addEventListener('click', handleAddMusic);
    ytUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleAddMusic();
    });

    // Realtime Database Sync for Music
    onValue(musicRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        cachedTracks = Object.keys(data).map(key => ({
          firebaseKey: key,
          ...data[key]
        })).sort((a, b) => b.createdAt - a.createdAt);
      } else {
        cachedTracks = [];
      }
      if (musicModal.classList.contains('open')) {
        renderMusic();
      }
    }, (error) => {
      console.error("Music listener error:", error);
    });

    function renderMusic() {
      if (!cachedTracks.length) {
        musicContainer.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 48px 0;">No music added yet. Paste a link above to play.</p>';
        return;
      }

      const grouped = cachedTracks.reduce((acc, curr) => {
        acc[curr.date] = acc[curr.date] || [];
        acc[curr.date].push(curr);
        return acc;
      }, {});

      musicContainer.innerHTML = '';
      Object.keys(grouped).forEach(date => {
        const groupEl = document.createElement('div');
        groupEl.className = 'date-group';

        const dateLabel = new Date(date + 'T00:00:00').toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        groupEl.innerHTML = `<h4>${dateLabel}</h4>`;

        grouped[date].forEach(track => {
          const isCurrent = activeTrack && activeTrack.firebaseKey === track.firebaseKey;
          const row = document.createElement('div');
          row.className = 'history-item';
          row.innerHTML = `
            <div class="history-item-meta" data-track-key="${track.firebaseKey}">
              <span class="history-item-title ${isCurrent ? 'active-playing' : ''}">
                ${isCurrent && isMusicPlaying ? '▶ ' : ''}${track.title}
              </span>
            </div>
            <div class="history-item-right">
              <div class="menu-wrap">
                <button class="menu-trigger" data-key="${track.firebaseKey}" aria-label="Options">&#8942;</button>
                <div class="dropdown-menu" id="track-menu-${track.firebaseKey}">
                  <button class="danger delete-track-action" data-key="${track.firebaseKey}">Delete</button>
                </div>
              </div>
            </div>
          `;
          groupEl.appendChild(row);
        });

        musicContainer.appendChild(groupEl);
      });

      // Item click: Play track
      musicContainer.querySelectorAll('.history-item-meta').forEach(el => {
        el.addEventListener('click', () => {
          const key = el.getAttribute('data-track-key');
          const track = cachedTracks.find(t => t.firebaseKey === key);
          if (track) playTrack(track);
        });
      });

      // Dropdown toggle
      musicContainer.querySelectorAll('.menu-trigger').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const menu = document.getElementById(`track-menu-${btn.dataset.key}`);
          const wasOpen = menu.classList.contains('active');
          closeAllDropdowns();
          if (!wasOpen) menu.classList.add('active');
        });
      });

      // Delete action
      musicContainer.querySelectorAll('.delete-track-action').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          closeAllDropdowns();
          const key = btn.dataset.key;
          if (confirm('Delete this track from music history?')) {
            if (activeTrack && activeTrack.firebaseKey === key) {
              if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
              musicBar.classList.remove('active');
              activeTrack = null;
            }
            try {
              await remove(ref(db, `music_tracks/${key}`));
            } catch (err) {
              alert('Failed to delete track: ' + err.message);
            }
          }
        });
      });
    }

    // Timer & Session Logic
    function formatTime(totalSeconds) {
      const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const s = String(totalSeconds % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function getNextSessionNumber() {
      if (!cachedSessions.length) return 1;
      const numbers = cachedSessions.map(item => item.sessionNum || 0);
      return Math.max(...numbers, 0) + 1;
    }

    function updateSessionBadge() {
      const nextNum = getNextSessionNumber();
      sessionBadge.textContent = `S${nextNum}:`;
    }

    function updateTodayTotal() {
      const todayStr = new Date().toISOString().split('T')[0];
      const todaySeconds = cachedSessions
        .filter(entry => entry.date === todayStr)
        .reduce((sum, entry) => sum + entry.duration, 0);
      todayTotalDisplay.textContent = formatTime(todaySeconds);
    }

    function updateLiveClock() {
      const now = new Date();
      const dateStr = now.toLocaleDateString(undefined, {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });
      const timeStr = now.toLocaleTimeString(undefined, {
        hour: '2-digit',
        minute: '2-digit'
      });
      liveClock.textContent = `${dateStr} · ${timeStr}`;
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    function setRunningState(isRunning) {
      if (isRunning) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        playPauseBtn.title = 'Pause [Space / K]';
        stopBtn.disabled = false;
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        playPauseBtn.title = secondsElapsed > 0 ? 'Resume [Space / K]' : 'Start [Space / K]';
      }
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.dropdown-menu.active').forEach(menu => {
        menu.classList.remove('active');
      });
    }

    // Sessions Firebase Listener
    onValue(sessionsRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        cachedSessions = Object.keys(data).map(key => ({
          firebaseKey: key,
          ...data[key]
        })).sort((a, b) => b.createdAt - a.createdAt);
      } else {
        cachedSessions = [];
      }
      updateTodayTotal();
      updateSessionBadge();
      if (historyModal.classList.contains('open')) {
        renderHistory();
      }
    }, (error) => {
      console.error("Session listener error:", error);
    });

    function renderHistory() {
      if (!cachedSessions.length) {
        historyContainer.innerHTML = '<p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 48px 0;">No sessions recorded yet.</p>';
        return;
      }

      const grouped = cachedSessions.reduce((acc, curr) => {
        acc[curr.date] = acc[curr.date] || [];
        acc[curr.date].push(curr);
        return acc;
      }, {});

      historyContainer.innerHTML = '';
      Object.keys(grouped).forEach(date => {
        const groupEl = document.createElement('div');
        groupEl.className = 'date-group';

        const dateLabel = new Date(date + 'T00:00:00').toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        groupEl.innerHTML = `<h4>${dateLabel}</h4>`;

        grouped[date].forEach(item => {
          const row = document.createElement('div');
          row.className = 'history-item';
          row.innerHTML = `
            <div class="history-item-meta">
              <span class="history-item-title">${item.name}</span>
              ${item.desc ? `<span class="history-item-desc">${item.desc}</span>` : ''}
            </div>
            <div class="history-item-right">
              <div class="history-item-time">${formatTime(item.duration)}</div>
              <div class="menu-wrap">
                <button class="menu-trigger" data-key="${item.firebaseKey}" aria-label="Options">&#8942;</button>
                <div class="dropdown-menu" id="session-menu-${item.firebaseKey}">
                  <button class="danger delete-session-action" data-key="${item.firebaseKey}">Delete</button>
                </div>
              </div>
            </div>
          `;
          groupEl.appendChild(row);
        });

        historyContainer.appendChild(groupEl);
      });

      // Dropdown toggle
      historyContainer.querySelectorAll('.menu-trigger').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const menu = document.getElementById(`session-menu-${btn.dataset.key}`);
          const wasOpen = menu.classList.contains('active');
          closeAllDropdowns();
          if (!wasOpen) menu.classList.add('active');
        });
      });

      // Session Delete Action
      historyContainer.querySelectorAll('.delete-session-action').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          closeAllDropdowns();
          const key = btn.dataset.key;
          if (confirm('Delete this study session record?')) {
            try {
              await remove(ref(db, `study_sessions/${key}`));
            } catch (err) {
              alert('Failed to delete session: ' + err.message);
            }
          }
        });
      });
    }

    function toggleTimer() {
      if (!timerInterval) {
        timerInterval = setInterval(() => {
          secondsElapsed++;
          display.textContent = formatTime(secondsElapsed);
        }, 1000);
        setRunningState(true);
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
        setRunningState(false);
      }
    }

    async function finishSession() {
      if (secondsElapsed > 0) {
        clearInterval(timerInterval);
        timerInterval = null;

        const sessionNum = getNextSessionNumber();
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const defaultName = `S${sessionNum}: ${yyyy}-${mm}-${dd} ${hh}:${min}`;

        const inputVal = nameInput.value.trim();
        const sessionTitle = inputVal ? `S${sessionNum}: ${inputVal}` : defaultName;

        const sessionData = {
          sessionNum: sessionNum,
          name: sessionTitle,
          desc: descInput.value.trim(),
          duration: secondsElapsed,
          date: `${yyyy}-${mm}-${dd}`,
          createdAt: Date.now()
        };

        try {
          const newSessionRef = push(sessionsRef);
          await withTimeout(set(newSessionRef, sessionData));
        } catch (err) {
          console.error('Failed to save session:', err);
          alert('Could not save session to database: ' + err.message);
        }

        secondsElapsed = 0;
        display.textContent = '00:00:00';
        setRunningState(false);
        stopBtn.disabled = true;
        nameInput.value = '';
        descInput.value = '';
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      secondsElapsed = 0;
      display.textContent = '00:00:00';
      setRunningState(false);
      stopBtn.disabled = true;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    playPauseBtn.addEventListener('click', toggleTimer);
    stopBtn.addEventListener('click', finishSession);
    resetBtn.addEventListener('click', resetTimer);

    // Modal navigation
    openHistory.addEventListener('click', () => {
      renderHistory();
      historyModal.classList.add('open');
    });

    closeHistory.addEventListener('click', () => {
      historyModal.classList.remove('open');
      closeAllDropdowns();
    });

    openMusic.addEventListener('click', () => {
      renderMusic();
      musicModal.classList.add('open');
    });

    closeMusic.addEventListener('click', () => {
      musicModal.classList.remove('open');
      closeAllDropdowns();
    });

    // Global Key Handlers
    window.addEventListener('keydown', (e) => {
      const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (activeTag === 'input' || activeTag === 'textarea') {
        if (e.key === 'Enter' && document.activeElement.id === 'sessionName') {
          e.preventDefault();
          document.activeElement.blur();
          finishSession();
        }
        return;
      }

      if (e.code === 'Space' || e.key === 'k' || e.key === 'K') {
        e.preventDefault();
        toggleTimer();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        finishSession();
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        resetTimer();
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        toggleMusicPlayback();
      } else if (e.key === 'Escape') {
        historyModal.classList.remove('open');
        musicModal.classList.remove('open');
        closeAllDropdowns();
      }
    });

    window.addEventListener('click', (e) => {
      if (!e.target.closest('.menu-wrap')) {
        closeAllDropdowns();
      }
    });
  </script>
</body>
</html>
